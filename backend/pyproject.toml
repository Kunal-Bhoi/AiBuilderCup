[project]
name = "tradecheck-backend"
version = "0.1.0"
description = "api-service and worker-service for cross-document trade file pre-validation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "httpx>=0.27",
  "google-auth>=2.30",
  "google-cloud-storage>=2.17",
  "google-cloud-tasks>=2.16",
  "google-cloud-kms>=2.24",
  "cloud-sql-python-connector[asyncpg]>=1.11",
  "firebase-admin>=6.5",
  "pypdfium2>=4.30",
  "pypdf>=4.3",
  "pillow>=10.4",
  "pillow-heif>=0.18",
  "reportlab>=4.2",
  "cryptography>=43",
  "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.uv]
package = false

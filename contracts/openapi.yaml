openapi: 3.1.0
info:
  title: TradeCheck api-service
  description: 'Cross-document trade file pre-validation. The system never files anything:
    it produces findings, a licensed human decides, and every decision is logged.'
  version: 0.1.0
paths:
  /healthz:
    get:
      tags:
      - system
      summary: Healthz
      operationId: healthz_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /health:
    get:
      tags:
      - system
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/healthz:
    get:
      tags:
      - system
      summary: Healthz
      operationId: healthz_api_v1_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/health:
    get:
      tags:
      - system
      summary: Health
      operationId: health_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/shipments:
    post:
      tags:
      - shipments
      summary: Create Shipment
      operationId: create_shipment_api_v1_shipments_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipmentCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - shipments
      summary: List Shipments
      operationId: list_shipments_api_v1_shipments_get
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/shipments/{shipment_id}:
    get:
      tags:
      - shipments
      summary: Get Shipment
      operationId: get_shipment_api_v1_shipments__shipment_id__get
      parameters:
      - name: shipment_id
        in: path
        required: true
        schema:
          type: string
          title: Shipment Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - shipments
      summary: Delete Shipment
      operationId: delete_shipment_api_v1_shipments__shipment_id__delete
      parameters:
      - name: shipment_id
        in: path
        required: true
        schema:
          type: string
          title: Shipment Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/shipments/{shipment_id}/upload-urls:
    post:
      tags:
      - documents
      summary: Create Upload Urls
      operationId: create_upload_urls_api_v1_shipments__shipment_id__upload_urls_post
      parameters:
      - name: shipment_id
        in: path
        required: true
        schema:
          type: string
          title: Shipment Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlsRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/shipments/{shipment_id}/documents:
    post:
      tags:
      - documents
      summary: Register Documents
      operationId: register_documents_api_v1_shipments__shipment_id__documents_post
      parameters:
      - name: shipment_id
        in: path
        required: true
        schema:
          type: string
          title: Shipment Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDocumentsRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterDocumentsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/shipments/{shipment_id}/documents/{document_id}:
    delete:
      tags:
      - documents
      summary: Remove Document
      operationId: remove_document_api_v1_shipments__shipment_id__documents__document_id__delete
      parameters:
      - name: shipment_id
        in: path
        required: true
        schema:
          type: string
          title: Shipment Id
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          title: Document Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - documents
      summary: Override Document Type
      operationId: override_document_type_api_v1_shipments__shipment_id__documents__document_id__patch
      parameters:
      - name: shipment_id
        in: path
        required: true
        schema:
          type: string
          title: Shipment Id
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          title: Document Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentPatch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/shipments/{shipment_id}/analyze:
    post:
      tags:
      - analysis
      summary: Analyze
      operationId: analyze_api_v1_shipments__shipment_id__analyze_post
      parameters:
      - name: shipment_id
        in: path
        required: true
        schema:
          type: string
          title: Shipment Id
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/shipments/{shipment_id}/events:
    get:
      tags:
      - analysis
      summary: Stream Events
      description: 'SSE progress. Replays the current run''s events (or everything
        after Last-Event-ID), then

        streams live ones. A '': heartbeat'' comment every 15 s keeps proxies from
        closing the stream.'
      operationId: stream_events_api_v1_shipments__shipment_id__events_get
      parameters:
      - name: shipment_id
        in: path
        required: true
        schema:
          type: string
          title: Shipment Id
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Last-Event-Id
      responses:
        '200':
          description: Successful Response
          content:
            text/event-stream: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/shipments/{shipment_id}/matrix:
    get:
      tags:
      - analysis
      summary: Matrix
      description: 'One round trip per table for the current run, grouped in Python:
        O(D·F) rows.'
      operationId: matrix_api_v1_shipments__shipment_id__matrix_get
      parameters:
      - name: shipment_id
        in: path
        required: true
        schema:
          type: string
          title: Shipment Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatrixResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/shipments/{shipment_id}/discrepancies:
    get:
      tags:
      - analysis
      summary: List Discrepancies
      operationId: list_discrepancies_api_v1_shipments__shipment_id__discrepancies_get
      parameters:
      - name: shipment_id
        in: path
        required: true
        schema:
          type: string
          title: Shipment Id
      - name: include_decided
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Decided
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscrepancyList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/shipments/{shipment_id}/coverage:
    get:
      tags:
      - analysis
      summary: Coverage
      description: 'Principle 2.4: what was NOT checked is reported as prominently
        as what was.'
      operationId: coverage_api_v1_shipments__shipment_id__coverage_get
      parameters:
      - name: shipment_id
        in: path
        required: true
        schema:
          type: string
          title: Shipment Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/discrepancies/{discrepancy_id}/decision:
    post:
      tags:
      - decisions
      summary: Record Decision
      operationId: record_decision_api_v1_discrepancies__discrepancy_id__decision_post
      parameters:
      - name: discrepancy_id
        in: path
        required: true
        schema:
          type: string
          title: Discrepancy Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/shipments/{shipment_id}/decisions:
    get:
      tags:
      - decisions
      summary: Decision History
      operationId: decision_history_api_v1_shipments__shipment_id__decisions_get
      parameters:
      - name: shipment_id
        in: path
        required: true
        schema:
          type: string
          title: Shipment Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/shipments/{shipment_id}/report:
    post:
      tags:
      - reports
      summary: Issue Report
      operationId: issue_report_api_v1_shipments__shipment_id__report_post
      parameters:
      - name: shipment_id
        in: path
        required: true
        schema:
          type: string
          title: Shipment Id
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - reports
      summary: Get Report
      operationId: get_report_api_v1_shipments__shipment_id__report_get
      parameters:
      - name: shipment_id
        in: path
        required: true
        schema:
          type: string
          title: Shipment Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/documents/{document_id}/pages/{page}/image:
    get:
      tags:
      - pages
      summary: Page Image
      operationId: page_image_api_v1_documents__document_id__pages__page__image_get
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          title: Document Id
      - name: page
        in: path
        required: true
        schema:
          type: integer
          title: Page
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageImageOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/documents/{document_id}/pages/{page}/crop:
    get:
      tags:
      - pages
      summary: Page Crop
      operationId: page_crop_api_v1_documents__document_id__pages__page__crop_get
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          title: Document Id
      - name: page
        in: path
        required: true
        schema:
          type: integer
          title: Page
      - name: bbox
        in: query
        required: true
        schema:
          type: string
          description: x0,y0,x1,y1 normalised 0..1
          title: Bbox
        description: x0,y0,x1,y1 normalised 0..1
      responses:
        '200':
          description: Successful Response
          content:
            image/png: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/org/effectiveness:
    get:
      tags:
      - org
      summary: Effectiveness
      operationId: effectiveness_api_v1_org_effectiveness_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectivenessResponse'
  /api/v1/org/audit/verify:
    get:
      tags:
      - org
      summary: Verify Audit
      operationId: verify_audit_api_v1_org_audit_verify_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditVerifyResponse'
components:
  schemas:
    AnalyzeResponse:
      properties:
        shipment_id:
          type: string
          title: Shipment Id
        run_id:
          type: string
          title: Run Id
        status:
          $ref: '#/components/schemas/ShipmentStatus'
      additionalProperties: false
      type: object
      required:
      - shipment_id
      - run_id
      - status
      title: AnalyzeResponse
    AuditVerifyResponse:
      properties:
        org_id:
          type: string
          title: Org Id
        valid:
          type: boolean
          title: Valid
        events_checked:
          type: integer
          title: Events Checked
        first_break:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: First Break
      additionalProperties: false
      type: object
      required:
      - org_id
      - valid
      - events_checked
      - first_break
      title: AuditVerifyResponse
    CellOut:
      properties:
        document_id:
          type: string
          title: Document Id
        cell_status:
          $ref: '#/components/schemas/CellStatus'
        raw_value:
          anyOf:
          - type: string
          - type: 'null'
          title: Raw Value
        normalized_value:
          anyOf:
          - type: string
          - type: 'null'
          title: Normalized Value
        normalized_unit:
          anyOf:
          - type: string
          - type: 'null'
          title: Normalized Unit
        confidence:
          type: number
          title: Confidence
        provenance:
          anyOf:
          - $ref: '#/components/schemas/ProvenanceOut'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - document_id
      - cell_status
      - raw_value
      - normalized_value
      - confidence
      - provenance
      title: CellOut
    CellStatus:
      type: string
      enum:
      - PRESENT
      - LOW_CONFIDENCE
      - ABSENT
      - NOT_APPLICABLE
      - UNREADABLE
      title: CellStatus
    CoverageField:
      properties:
        field_key:
          type: string
          title: Field Key
        label:
          type: string
          title: Label
        group:
          type: string
          title: Group
        verdict:
          $ref: '#/components/schemas/Verdict'
      additionalProperties: false
      type: object
      required:
      - field_key
      - label
      - group
      - verdict
      title: CoverageField
    CoverageResponse:
      properties:
        shipment_id:
          type: string
          title: Shipment Id
        run_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Run Id
        checked_fields:
          items:
            $ref: '#/components/schemas/CoverageField'
          type: array
          title: Checked Fields
        single_source_fields:
          items:
            $ref: '#/components/schemas/CoverageField'
          type: array
          title: Single Source Fields
        cannot_verify_fields:
          items:
            $ref: '#/components/schemas/CoverageField'
          type: array
          title: Cannot Verify Fields
        not_applicable_fields:
          items:
            $ref: '#/components/schemas/CoverageField'
          type: array
          title: Not Applicable Fields
        out_of_scope:
          items:
            $ref: '#/components/schemas/OutOfScopeOut'
          type: array
          title: Out Of Scope
        unchecked_documents:
          items:
            $ref: '#/components/schemas/UncheckedDocument'
          type: array
          title: Unchecked Documents
        missing_documents:
          items:
            $ref: '#/components/schemas/MissingDocumentOut'
          type: array
          title: Missing Documents
      additionalProperties: false
      type: object
      required:
      - shipment_id
      - run_id
      - checked_fields
      - single_source_fields
      - cannot_verify_fields
      - not_applicable_fields
      - out_of_scope
      - unchecked_documents
      - missing_documents
      title: CoverageResponse
    DecisionAction:
      type: string
      enum:
      - ACCEPT_SUGGESTION
      - OVERRIDE
      - FLAG_FOR_FOLLOW_UP
      - DISMISS_AS_NOT_AN_ISSUE
      title: DecisionAction
    DecisionList:
      properties:
        shipment_id:
          type: string
          title: Shipment Id
        items:
          items:
            $ref: '#/components/schemas/DecisionOut'
          type: array
          title: Items
      additionalProperties: false
      type: object
      required:
      - shipment_id
      - items
      title: DecisionList
    DecisionOut:
      properties:
        decision_id:
          type: string
          title: Decision Id
        discrepancy_id:
          type: string
          title: Discrepancy Id
        shipment_id:
          type: string
          title: Shipment Id
        field_key:
          type: string
          title: Field Key
        action:
          $ref: '#/components/schemas/DecisionAction'
        chosen_document_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Chosen Document Id
        chosen_value:
          anyOf:
          - type: string
          - type: 'null'
          title: Chosen Value
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        actor_user_id:
          type: string
          title: Actor User Id
        decided_at:
          type: string
          format: date-time
          title: Decided At
      additionalProperties: false
      type: object
      required:
      - decision_id
      - discrepancy_id
      - shipment_id
      - field_key
      - action
      - chosen_document_id
      - chosen_value
      - reason
      - actor_user_id
      - decided_at
      title: DecisionOut
    DecisionRequest:
      properties:
        action:
          $ref: '#/components/schemas/DecisionAction'
        chosen_document_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Chosen Document Id
        chosen_value:
          anyOf:
          - type: string
          - type: 'null'
          title: Chosen Value
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        expected_version:
          type: integer
          title: Expected Version
      additionalProperties: false
      type: object
      required:
      - action
      - expected_version
      title: DecisionRequest
    DecisionResponse:
      properties:
        decision:
          $ref: '#/components/schemas/DecisionOut'
        discrepancy_version:
          type: integer
          title: Discrepancy Version
        shipment_status:
          $ref: '#/components/schemas/ShipmentStatus'
        remaining_undecided:
          type: integer
          title: Remaining Undecided
      additionalProperties: false
      type: object
      required:
      - decision
      - discrepancy_version
      - shipment_status
      - remaining_undecided
      title: DecisionResponse
    DiscrepancyList:
      properties:
        shipment_id:
          type: string
          title: Shipment Id
        run_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Run Id
        items:
          items:
            $ref: '#/components/schemas/DiscrepancyOut'
          type: array
          title: Items
      additionalProperties: false
      type: object
      required:
      - shipment_id
      - run_id
      - items
      title: DiscrepancyList
    DiscrepancyOut:
      properties:
        discrepancy_id:
          type: string
          title: Discrepancy Id
        shipment_id:
          type: string
          title: Shipment Id
        field_key:
          type: string
          title: Field Key
        label:
          type: string
          title: Label
        verdict:
          $ref: '#/components/schemas/Verdict'
        verdict_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Verdict Reason
        severity:
          $ref: '#/components/schemas/Severity'
        explanation:
          anyOf:
          - type: string
          - type: 'null'
          title: Explanation
        explanation_state:
          $ref: '#/components/schemas/ExplanationState'
        assessment_confidence:
          anyOf:
          - type: string
            enum:
            - HIGH
            - MODERATE
            - LOW
          - type: 'null'
          title: Assessment Confidence
        likely_incorrect_document_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Likely Incorrect Document Id
        suggested_document_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Suggested Document Id
        suggested_value:
          anyOf:
          - type: string
          - type: 'null'
          title: Suggested Value
        version:
          type: integer
          title: Version
        decided:
          type: boolean
          title: Decided
        latest_decision:
          anyOf:
          - $ref: '#/components/schemas/DecisionOut'
          - type: 'null'
        cells:
          items:
            $ref: '#/components/schemas/CellOut'
          type: array
          title: Cells
        created_at:
          type: string
          format: date-time
          title: Created At
      additionalProperties: false
      type: object
      required:
      - discrepancy_id
      - shipment_id
